<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Shop Capstone</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Navigation Bar -->
    <nav class="navbar">
        <div class="nav-container">
            <div class="logo">Shop</div>
            <ul class="nav-menu">
                <li><a href="#home">Home</a></li>
                <li><a href="#about">About</a></li>
                <li><a href="#services">Services</a></li>
                <li><a href="#contact">Contact</a></li>
                <li><a href="index.html" class="login-btn">Login</a></li>
            </ul>
        </div>
    </nav>

    <!-- Background -->
    <div class="forest-background"></div>

    <!-- Register Modal -->
    <div id="registerModal" class="modal active">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h1>Register</h1>
            <form id="registerForm">
                <div class="form-group">
                    <input type="text" id="fullName" placeholder="Full Name" required>
                    <span class="icon">👤</span>
                </div>
                <div class="form-group">
                    <input type="email" id="registerEmail" placeholder="Email" required>
                    <span class="icon">✉</span>
                </div>
                <div class="form-group">
                    <input type="tel" id="phone" placeholder="Phone Number" required>
                    <span class="icon">📱</span>
                </div>
                <div class="form-group">
                    <input type="password" id="registerPassword" placeholder="Password" required>
                    <span class="icon">🔒</span>
                </div>
                <div class="form-group">
                    <input type="password" id="confirmPassword" placeholder="Confirm Password" required>
                    <span class="icon">🔒</span>
                </div>
                <div class="form-options">
                    <label class="checkbox">
                        <input type="checkbox" id="agreeTerms" required>
                        I agree to the Terms & Conditions
                    </label>
                </div>
                <button type="submit" class="login-button">Register</button>
                <p class="register-link">Already have an account? <a href="index.html">Login</a></p>
            </form>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script src="js/register.js"></script>
</body>
</html>
