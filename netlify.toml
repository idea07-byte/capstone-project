# ==============================================================================
# Netlify Configuration for BuyIt Multi-Vendor Marketplace Frontend
# ==============================================================================

[build]
  base = "frontend"
  publish = "dist"
  command = "npm run build"

# SPA Fallback for client-side routing (React Router)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[build.environment]
  NODE_VERSION = "20"
