services:
  - type: web
    name: buyit-marketplace
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PORT
        value: 10000
      - key: JAVA_OPTS
        value: "-Djava.awt.headless=true -XX:+UseG1GC -XX:MaxRAMPercentage=75.0"
